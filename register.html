<!DOCTYPE html>
<html lang="en">
<head>
    <title>CampusConnect Registration</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-box">

    <h1>CampusConnect</h1>
    <h2>Create Account</h2>

    <input type="text" id="name" placeholder="Full Name">

    <input type="email" id="newEmail" placeholder="Email Address">

    <input type="password" id="newPassword" placeholder="Create Password">

    <button onclick="register()">Create Account</button>

    <p id="message"></p>

    <p>Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script>
function register() {

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("newEmail").value.trim();
    let password = document.getElementById("newPassword").value;

    if (!name || !email || !password) {
        document.getElementById("message").innerText = "Fill all details.";
        return;
    }

    if (password.length < 6) {
        document.getElementById("message").innerText = "Password must have at least 6 characters.";
        return;
    }

    localStorage.setItem("studentName", name);
    localStorage.setItem("studentEmail", email);
    localStorage.setItem("studentPassword", password);

    alert("Account created successfully!");

    window.location.href = "login.html";
}
</script>

</body>
</html>
